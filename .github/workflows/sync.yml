name: Sync Jira to Google Sheets

on:
  schedule:
    # Every 30 minutes from 09:00 to 22:30 Cairo time (UTC+3 now, hours 6-19 UTC).
    # Egypt moves to UTC+2 on 29 Oct 2026: change "6-19" to "7-20" to keep 09:00-22:30.
    - cron: "*/30 6-19 * * *"
  workflow_dispatch:

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bo_sheets.py
        env:
          JIRA_BASE_URL: https://connect-money.atlassian.net
          JIRA_EMAIL: mohamed.magdy@connect.money
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BO_SHEET_ID: 11D_zoUrKeFTuEFU1huBSpSK9NktCITCgSxptLfzkljc
          INPROGRESS_SHEET_ID: 11le0pAqXEfVtitgWO_GQvJu4p0PNQ52cylEAFTEHPLE
