name: Sync Jira to Google Sheets

on:
  schedule:
    # Cairo time is UTC+3 until Egypt ends daylight saving at the end of October 2026.
    # Day shift: every 30 minutes, 09:00-22:30 Cairo (06:00-19:30 UTC).
    - cron: "*/30 6-19 * * *"
    # Night shift: every hour, 23:00-08:00 Cairo (20:00-05:00 UTC).
    - cron: "0 20-23,0-5 * * *"
    # When the clocks go back (UTC+2), shift both lines by one hour:
    #   "*/30 7-20 * * *" and "0 21-23,0-6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bo_sheets.py
        env:
          JIRA_BASE_URL: https://connect-money.atlassian.net
          JIRA_EMAIL: mohamed.magdy@connect.money
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BO_SHEET_ID: 11D_zoUrKeFTuEFU1huBSpSK9NktCITCgSxptLfzkljc
          INPROGRESS_SHEET_ID: 11le0pAqXEfVtitgWO_GQvJu4p0PNQ52cylEAFTEHPLE
