name: Sync Jira to Google Sheets

on:
  schedule:
    # Backup schedule. GitHub treats schedules as best-effort and drops or delays runs that start on
    # :00 and :30, so these use odd minutes. The reliable trigger is apps-script/trigger.gs (see README).
    # Cairo is UTC+3 until the end of October 2026, then UTC+2 (shift the hours by one).
    - cron: "7,37 6-19 * * *"     # day: about every 30 min, 09:07-22:37 Cairo
    - cron: "17 20-23,0-5 * * *"  # night: hourly, 23:17-08:17 Cairo
  workflow_dispatch:

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bo_sheets.py
        env:
          JIRA_BASE_URL: https://connect-money.atlassian.net
          JIRA_EMAIL: mohamed.magdy@connect.money
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BO_SHEET_ID: 11D_zoUrKeFTuEFU1huBSpSK9NktCITCgSxptLfzkljc
          INPROGRESS_SHEET_ID: 11le0pAqXEfVtitgWO_GQvJu4p0PNQ52cylEAFTEHPLE
